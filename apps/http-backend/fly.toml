app = "excalidraw-http-backend"

kill_signal = "SIGINT"
kill_timeout = 5

[build]
  builder = "heroku/builder:22"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 3001
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2
    grace_period = "5s"
