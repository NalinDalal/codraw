name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/codraw' }}
      REPO_URL: ${{ vars.REPO_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: SSH connectivity probe
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              'echo SSH_OK; hostname; uptime' || {
            echo "::error::SSH to EC2 failed (exit $?) — check instance is running,"
            echo "::error::security group allows inbound TCP 22, and EC2_HOST is the public IP"
            exit 1
          }

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "APP_DIR='$APP_DIR' REPO_URL='$REPO_URL' bash -s" << 'DEPLOY'
            set -euo pipefail

            # Non-interactive shell — bun lives in ~/.bun/bin
            export PATH="$HOME/.bun/bin:$PATH"
            export BUN_INSTALL="$HOME/.bun"

            echo ">>> Pulling latest code..."
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main
            fi

            cd "$APP_DIR"

            echo ">>> Loading env..."
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi

            echo ">>> Installing dependencies..."
            bun install --frozen-lockfile

            echo ">>> Generating Prisma client..."
            cd packages/db && bun prisma generate && cd ../..

            echo ">>> Building..."
            bun run build

            echo ">>> Running Prisma migrations..."
            cd packages/db && bun prisma migrate deploy && cd ../..

            echo ">>> Restarting services..."
            pm2 start deploy/pm2/ecosystem.config.js --update-env
            pm2 save

            echo ">>> Deploy complete."
          DEPLOY
