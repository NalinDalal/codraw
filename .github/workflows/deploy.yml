name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/codraw' }}
      REPO_URL: ${{ vars.REPO_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY'
            set -euo pipefail

            echo ">>> Pulling latest code..."
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main
            fi

            cd "$APP_DIR"

            echo ">>> Loading env..."
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi

            echo ">>> Installing dependencies..."
            bun install --frozen-lockfile

            echo ">>> Building..."
            bun run build

            echo ">>> Running Prisma migrations..."
            cd packages/db && bun prisma migrate deploy && cd ../..

            echo ">>> Restarting services..."
            pm2 restart ecosystem.config.js --update-env || pm2 start deploy/pm2/ecosystem.config.js --update-env
            pm2 save

            echo ">>> Deploy complete."
          DEPLOY
