# codraw nginx config — managed in-repo, applied by the deploy workflow.
# Domain: codraw.nerdev.in  (point DNS A record at the EC2 Elastic IP)
#
# First-time setup on the server (once):
#   sudo certbot certonly --nginx -d codraw.nerdev.in -d www.codraw.nerdev.in
#   sudo nginx -t && sudo systemctl reload nginx
# Certbot renewal is automatic (systemd timer); it never edits this file
# (certonly leaves the config untouched).

server {
    listen 80;
    server_name codraw.nerdev.in www.codraw.nerdev.in;

    client_max_body_size 20m;   # image uploads

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (frontend proxies /ws to the ws-backend internally)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name codraw.nerdev.in www.codraw.nerdev.in;

    ssl_certificate     /etc/letsencrypt/live/codraw.nerdev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codraw.nerdev.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
